<div class="lesson-detail">
  <h1>Edit Lesson</h1>

  <div class="form-control edit-lesson">
    <label>Lesson title:</label>
    <input
      placeholder="Enter course title"
      [value]="lesson()?.description"
      #input
    />
  </div>
</div>

<div class="form-actions">
  <button type="button" class="btn" (click)="updateLesson(input.value)">
    Save
  </button>

  <button type="button" class="btn" (click)="cancelLessonUpdating()">
    Cancel
  </button>
</div>
