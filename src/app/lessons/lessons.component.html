<div class="lessons">
  @if (mode() === "master") {
    <div class="header">
      <h2>Search Lessons</h2>
      <div class="form-control search-controls">
        <input
          type="text"
          placeholder="Search for a lesson"
          (keyup)="searchLesson()"
          #search
        />
        <button type="button" class="btn" (click)="searchLesson()">
          Search
        </button>
      </div>
    </div>
    @if (lessons().length > 0) {
      <div class="table-contaniner">
        <table class="results-table">
          @for (lesson of lessons(); track lesson.id) {
            <tr (click)="selectLesson(lesson)">
              <td>{{ lesson.description }}</td>
              <td>{{ lesson.duration }}</td>
            </tr>
          }
        </table>
      </div>
    } @else {
      <p>No lessons found.</p>
    }
  } @else {
    <lesson-detail
      [lesson]="selectedLesson()"
      (cancel)="cancelLessonUpdating()"
      (lessonUpdated)="updateLesson($event)"
    />
  }
</div>
