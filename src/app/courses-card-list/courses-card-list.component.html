@for (course of courses(); track course.id) {
  <div class="course-card">
    <div class="course-header">
      <span class="course-title">{{ course.title }}</span>
    </div>
    <img
      [src]="course.iconUrl"
      [alt]="course.title"
      title="course image"
      class="course-image"
    />
    <div class="course-description">
      <p>{{ course.longDescription }}</p>
    </div>
    <div class="course-actions">
      <button type="button" class="btn" [routerLink]="['courses', course.id]">
        View
      </button>
      <button type="button" class="btn" (click)="editCourse(course)">
        Edit
      </button>
      <button type="button" class="btn" (click)="deleteCourse(course.id)">
        Delete
      </button>
    </div>
  </div>
}
