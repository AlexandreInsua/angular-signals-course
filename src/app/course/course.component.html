<div class="course container">
  <div class="course-header">
    <h1>{{ courser()?.title }}</h1>
    <img
      class="course-image"
      [src]="courser()?.iconUrl"
      [alt]="courser()?.title"
      title="{{ courser()?.title }}"
    />
  </div>
  <div class="table-container">
    <table class="results-table">
      @for (lesson of lessons(); track lesson.id) {
        <tr>
          <td>{{ lesson.id }}</td>
          <td>{{ lesson.description }}</td>
          <td>{{ lesson.duration }}</td>
        </tr>
      }
    </table>
  </div>
</div>
