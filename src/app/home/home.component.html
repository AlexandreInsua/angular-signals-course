<div class="courses-panel">
  <h3>All Courses</h3>

  <button class="btn" (click)="createCourse()">Add Course</button>

  <mat-tab-group>
    <mat-tab label="Beginners">
      <courses-card-list
        [courses]="baginnerCouses()"
        (courseUpdated)="refreshCourse($event)"
        (courseDeleted)="deleteCourse($event)"
      ></courses-card-list>
    </mat-tab>

    <mat-tab label="Advanced">
      <courses-card-list
        [courses]="advancedCouses()"
        (courseUpdated)="refreshCourse($event)"
        (courseDeleted)="deleteCourse($event)"
      ></courses-card-list>
    </mat-tab>
  </mat-tab-group>
</div>
